name: R-CMD-check

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  postgres-integration:
    runs-on: ubuntu-latest
    name: PostgreSQL integration (R release)

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alerttools_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alerttools_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ALERTTOOLS_TEST_POSTGRES: "true"
      PGDATABASE: alerttools_test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Run the complete suite against ephemeral PostgreSQL
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

  coverage:
    runs-on: ubuntu-latest
    name: Coverage indicator (R release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: check

      - name: Measure package coverage
        run: Rscript -e 'coverage <- covr::package_coverage(); print(coverage); saveRDS(coverage, "coverage.rds")'

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-rds
          path: coverage.rds

  lint:
    runs-on: ubuntu-latest
    name: Static lint checks

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
          needs: check

      - name: Lint package sources
        run: Rscript -e 'lintr::lint_package()'

  migration-inventory:
    runs-on: ubuntu-latest
    name: Consumer migration inventory

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Validate migration registry and removal gate inputs
        run: Rscript tools/check-migration-readiness.R
