name: pkgdown

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish after maintainer validation
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.event.inputs.confirmation == 'publish'
    runs-on: ubuntu-latest
    environment: pkgdown-production

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Build the site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)'

      - name: Publish the validated site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pkgdown-site
          clean: true
